# Postgres untuk development saja. Produksi: PostgreSQL lokal per OS (ADR-002, DEC-08).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: localcbt
      POSTGRES_PASSWORD: localcbt-dev
      POSTGRES_DB: localcbt
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
