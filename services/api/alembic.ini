[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# URL diambil dari app.config (env LOCALCBT_DATABASE_URL), bukan dari file ini.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
