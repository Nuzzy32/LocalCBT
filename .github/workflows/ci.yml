name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: localcbt
          POSTGRES_PASSWORD: localcbt-dev
          POSTGRES_DB: localcbt
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      # Tes backup/restore memakai pg_dump/pg_restore sungguhan; versi mayor = server (16).
      - run: |
          sudo apt-get update && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          LOCALCBT_PG_BIN_DIR: /usr/lib/postgresql/16/bin
      # M9-03: 30 siswa serentak di 2 ujian terhadap uvicorn sungguhan (target P95 PRD §3.2,
      # integritas jawaban, tanpa deadlock pool/thread). Laporan JSON diunggah sebagai artifact.
      - name: Uji beban singkat
        env:
          LOCALCBT_DATABASE_URL: postgresql+psycopg://localcbt:localcbt-dev@127.0.0.1:5432/localcbt_load
          LOCALCBT_COOKIE_SECURE: "false"
          LOCALCBT_ALLOWED_ORIGINS: '["http://127.0.0.1:8100"]'
          LOCALCBT_BACKUP_SCHEDULER_ENABLED: "false"
          LOCALCBT_LOG_LEVEL: WARNING
          PGPASSWORD: localcbt-dev
        run: |
          /usr/lib/postgresql/16/bin/createdb -h 127.0.0.1 -U localcbt localcbt_load
          uv run alembic upgrade head
          uv run uvicorn app.main:app --port 8100 --timeout-keep-alive 75 --no-access-log &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8100/api/v1/healthz && break; sleep 1; done
          uv run python loadtest.py seed --confirm-db localcbt_load --base-url http://127.0.0.1:8100 --questions 20
          uv run python loadtest.py run --think 0.5 --latency-factor 2
      # M9-04: kill -9 server, restart PostgreSQL, Wi-Fi putus, refresh (lihat chaos.py).
      - name: Uji gangguan
        env:
          LOCALCBT_DATABASE_URL: postgresql+psycopg://localcbt:localcbt-dev@127.0.0.1:5432/localcbt_chaos
          PGPASSWORD: localcbt-dev
        run: |
          /usr/lib/postgresql/16/bin/createdb -h 127.0.0.1 -U localcbt localcbt_chaos
          uv run alembic upgrade head
          uv run python chaos.py --confirm-db localcbt_chaos \
            --db-restart-cmd "sh -c 'docker restart \$(docker ps -q --filter ancestor=postgres:16)'"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loadtest-report
          path: services/api/loadtest-report-*.json
          if-no-files-found: ignore
      # Migrasi harus idempotent (M1 DoD)
      - run: uv run alembic upgrade head && uv run alembic upgrade head
      - run: uv run --with pip-audit pip-audit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm audit --prod

  control-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: QT_QPA_PLATFORM=offscreen uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --verbose
